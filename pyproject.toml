[project]
name = "mdacn-final"
version = "0.2.0"
description = "Phase-one scaffold for Reddit network characterization and opinion dynamics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "scipy",
    "hypothesis",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdacn"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
